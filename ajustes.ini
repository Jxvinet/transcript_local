; Modelo de Whisper. Mas grande = mejor y mas lento.
; Vale: tiny | base | small | medium | large-v2 | large-v3
modelo=small

; Idioma del audio. es = espanol. Deja vacio para autodetectar.
idioma=es

; Donde guardar las transcripciones.
; Escritorio\Transcripciones por defecto si lo dejas vacio.
carpeta=

; Formatos de salida: docx, txt, srt (separados por coma)
formatos=docx

; Dispositivo: cpu o cuda (si tienes GPU NVIDIA con CUDA)
dispositivo=cpu

; Tipo de calculo. En CPU suele ir bien int8. En GPU: float16
calculo=int8

; Si tu red corporativa rompe la descarga del modelo, pon 1.
; En casa dejalo en 0.
ssl_inseguro=0
